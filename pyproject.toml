[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aethelgard-mcp"
version = "0.1.0"
description = "Evidence-led market research, explicit valuation scenarios, and auditable MCP workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "httpx>=0.28,<1", "pydantic>=2.11,<3", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]

[project.scripts]
aethelgard-mcp = "aethelgard_mcp.server:main"
aethelgard-research = "aethelgard_mcp.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

